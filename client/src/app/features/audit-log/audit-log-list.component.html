<div class="audit-log-page">
  <p-toolbar styleClass="mb-3">
    <ng-template pTemplate="start">
      <h1 class="page-title">Audit Log</h1>
    </ng-template>
  </p-toolbar>

  <div class="filters-bar mb-3">
    <p-iconfield>
      <p-inputicon class="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Search action, module, user..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event); onSearchChange()"
      />
    </p-iconfield>
  </div>

  <p-table
    [value]="logs()"
    [lazy]="true"
    (onLazyLoad)="loadData($event)"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    dataKey="_id"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Date/Time</th>
        <th>User</th>
        <th>Action</th>
        <th>Module</th>
        <th>Description</th>
        <th>IP Address</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-log>
      <tr>
        <td>{{ log.createdAt | date: 'medium' }}</td>
        <td>{{ log.performedByUsername }}</td>
        <td><p-tag [value]="log.action" severity="info" /></td>
        <td>{{ log.module }}</td>
        <td>{{ log.description }}</td>
        <td>{{ log.ipAddress }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center py-4">No audit log entries found</td>
      </tr>
    </ng-template>
  </p-table>
</div>
