version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: projecta-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: projecta
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: projecta-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/projecta
      NODE_ENV: production
    volumes:
      - server-logs:/usr/src/app/logs

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: projecta-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "4200:80"

volumes:
  mongo-data:
  server-logs:
