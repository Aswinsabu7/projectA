<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid formgrid p-fluid">
    <div class="field col-12 md:col-6">
      <label for="firstName">First Name <span class="required-mark">*</span></label>
      <input id="firstName" type="text" pInputText formControlName="firstName" class="w-full" />
      <app-field-error [control]="form.controls.firstName" label="First name" />
    </div>

    <div class="field col-12 md:col-6">
      <label for="lastName">Last Name <span class="required-mark">*</span></label>
      <input id="lastName" type="text" pInputText formControlName="lastName" class="w-full" />
      <app-field-error [control]="form.controls.lastName" label="Last name" />
    </div>

    <div class="field col-12 md:col-6">
      <label for="email">Email <span class="required-mark">*</span></label>
      <input id="email" type="email" pInputText formControlName="email" class="w-full" />
      <app-field-error [control]="form.controls.email" label="Email" />
    </div>

    <div class="field col-12 md:col-6">
      <label for="mobile">Mobile <span class="required-mark">*</span></label>
      <input id="mobile" type="text" pInputText formControlName="mobile" class="w-full" />
      <app-field-error [control]="form.controls.mobile" label="Mobile" />
    </div>

    <div class="field col-12 md:col-6">
      <label for="username">Username <span class="required-mark">*</span></label>
      <input id="username" type="text" pInputText formControlName="username" class="w-full" />
      <app-field-error [control]="form.controls.username" label="Username" />
    </div>

    <div class="field col-12 md:col-6">
      <label for="role">Role <span class="required-mark">*</span></label>
      <p-select
        id="role"
        [options]="roles()"
        formControlName="role"
        optionLabel="name"
        optionValue="_id"
        placeholder="Select a role"
        styleClass="w-full"
      />
      <app-field-error [control]="form.controls.role" label="Role" />
    </div>

    @if (!user) {
      <div class="field col-12">
        <label for="password">Password <span class="required-mark">*</span></label>
        <p-password id="password" formControlName="password" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
        <app-field-error [control]="form.controls.password" label="Password" />
      </div>
    }
  </div>

  <div class="flex justify-content-end gap-2 mt-2">
    <button pButton type="button" label="Cancel" class="p-button-outlined" (click)="cancelled.emit()"></button>
    <button pButton type="submit" label="Save" icon="pi pi-save" [loading]="saving()"></button>
  </div>
</form>
