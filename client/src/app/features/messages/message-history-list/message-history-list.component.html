<p-toast />

<div class="messages-page">
  <p-toolbar styleClass="mb-3">
    <ng-template pTemplate="start">
      <h1 class="page-title">Message History</h1>
    </ng-template>
  </p-toolbar>

  <div class="filters-bar mb-3">
    <p-iconfield>
      <p-inputicon class="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Search subscriber name, mobile..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event); onSearchChange()"
      />
    </p-iconfield>

    <p-select
      [options]="statusOptions"
      [ngModel]="statusFilter()"
      (ngModelChange)="statusFilter.set($event); onSearchChange()"
      optionLabel="label"
      optionValue="value"
      placeholder="Status"
    />
  </div>

  <p-table
    [value]="messages()"
    [lazy]="true"
    (onLazyLoad)="loadData($event)"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    dataKey="_id"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Subscriber</th>
        <th>Mobile</th>
        <th>Message Date</th>
        <th>Type</th>
        <th>Status</th>
        <th>Provider</th>
        <th style="width: 100px">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-message>
      <tr>
        <td>{{ subscriberName(message) }}</td>
        <td>{{ message.mobileNumber }}</td>
        <td>{{ message.messageDate | date: 'medium' }}</td>
        <td>{{ message.messageType }}</td>
        <td><p-tag [value]="message.status" [severity]="statusSeverity(message.status)" /></td>
        <td>{{ message.provider }}</td>
        <td>
          <div class="row-actions">
            @if (message.status === 'Failed') {
              <button
                *appHasPermission="PERMISSIONS.MESSAGE_SEND"
                pButton
                type="button"
                icon="pi pi-refresh"
                class="p-button-text p-button-sm"
                [loading]="resendingId() === message._id"
                (click)="resend(message)"
              ></button>
            }
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center py-4">No messages found</td>
      </tr>
    </ng-template>
  </p-table>
</div>
